<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task 4 — Attractive Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="section">
        <div class="container">
          <div class="form-wrap" id="interactiveForm">
            <h1>Create your account</h1>
            <p class="subtitle">Join us to get started with awesome features</p>

            <form id="registerForm" novalidate>
              <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Jane Doe" required />
                <p class="error" data-for="name"></p>
              </div>

              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required />
                <p class="error" data-for="email"></p>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required />
                <p class="error" data-for="password"></p>
              </div>

              <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" minlength="8" required />
                <p class="error" data-for="confirm"></p>
              </div>

              <button type="submit" class="btn-primary">
                Create account
                <span class="btn-shine" aria-hidden="true"></span>
              </button>
            </form>
          </div>

          <div class="form-wrap thankyou hidden" id="thankYouCard" aria-live="polite">
            <h1>Thanks for registering 🎉</h1>
            <p class="subtitle">We’ve sent a confirmation email to your inbox.</p>
            <button class="btn-primary" id="backToForm">
              Back to form
              <span class="btn-shine" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
  </html>
